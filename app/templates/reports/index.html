{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block header_title %}Reports &amp; Exports{% endblock %}
{% block content %}

<div class="row g-3">
  <div class="col-lg-6">
    <div class="section-heading">Sales Reports</div>
    <form class="card-panel" method="GET" action="{{ url_for('reports.sales_csv') }}" id="salesRangeForm">
      <div class="row g-2 mb-3">
        <div class="col-6"><label class="form-label">From</label><input type="date" name="date_from" class="form-control" value="{{ today }}"></div>
        <div class="col-6"><label class="form-label">To</label><input type="date" name="date_to" class="form-control" value="{{ today }}"></div>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button formaction="{{ url_for('reports.sales_csv') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-filetype-csv"></i> CSV</button>
        <button formaction="{{ url_for('reports.sales_excel') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-filetype-xlsx"></i> Excel</button>
        <button formaction="{{ url_for('reports.tax_report_pdf') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-filetype-pdf"></i> Tax Report (PDF)</button>
      </div>
    </form>
  </div>

  <div class="col-lg-6">
    <div class="section-heading">Daily Sales Report (PDF)</div>
    <form class="card-panel" method="GET" action="{{ url_for('reports.daily_sales_pdf') }}">
      <label class="form-label">Date</label>
      <div class="d-flex gap-2">
        <input type="date" name="date" class="form-control" value="{{ today }}">
        <button class="btn btn-accent"><i class="bi bi-file-earmark-pdf"></i> Download</button>
      </div>
    </form>
  </div>

  <div class="col-lg-6">
    <div class="section-heading">Inventory Report</div>
    <div class="card-panel">
      <a href="{{ url_for('reports.inventory_csv') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-filetype-csv"></i> Download Inventory CSV</a>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="section-heading">Employee Report</div>
    <div class="card-panel">
      <a href="{{ url_for('reports.employees_csv') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-filetype-csv"></i> Download Employee CSV</a>
    </div>
  </div>
</div>
{% endblock %}
