{% extends "base.html" %} {% block title %}{{ 'Edit Employee' if employee else
'Add Employee' }}{% endblock %} {% block header_title %}{{ 'Edit Employee' if
employee else 'Add Employee' }}{% endblock %} {% block content %}
<div class="card-panel" style="max-width: 500px">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="mb-3">
      <label class="form-label">Name</label
      ><input
        type="text"
        name="name"
        class="form-control"
        required
        value="{{ employee.name if employee else '' }}"
      />
    </div>
    <div class="mb-3">
      <label class="form-label">Role</label
      ><input
        type="text"
        name="role"
        class="form-control"
        required
        placeholder="e.g. Chef, Waiter, Manager"
        value="{{ employee.role if employee else '' }}"
      />
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label
      ><input
        type="text"
        name="phone"
        class="form-control"
        required
        value="{{ employee.phone if employee else '' }}"
      />
    </div>
    <div class="mb-3">
      <label class="form-label">Salary</label
      ><input
        type="number"
        step="0.01"
        name="salary"
        class="form-control"
        required
        value="{{ employee.salary if employee else '' }}"
      />
    </div>
    {% if not employee %}
    <div class="mb-3">
      <label class="form-label">Joining Date</label
      ><input
        type="date"
        name="joining_date"
        class="form-control"
        required
        value="{{ today_iso }}"
      />
    </div>
    {% endif %}
    <div class="d-flex gap-2">
      <button class="btn btn-accent">Save</button>
      <a
        href="{{ url_for('employees.list_employees') }}"
        class="btn btn-outline-secondary"
        >Cancel</a
      >
    </div>
  </form>
</div>
{% endblock %}
