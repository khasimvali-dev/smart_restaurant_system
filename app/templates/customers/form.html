{% extends "base.html" %}
{% block title %}Add Customer{% endblock %}
{% block header_title %}Add Customer{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:460px;">
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
    <div class="d-flex gap-2">
      <button class="btn btn-accent">Save</button>
      <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
