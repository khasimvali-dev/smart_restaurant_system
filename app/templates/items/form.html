{% extends "base.html" %}
{% block title %}{{ 'Edit Item' if item else 'Add Item' }}{% endblock %}
{% block header_title %}{{ 'Edit Item' if item else 'Add New Item' }}{% endblock %}
{% block content %}

<div class="card-panel" style="max-width:560px;">
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      {% if not item %}
      <div class="col-6">
        <label class="form-label">Item ID / SKU</label>
        <input type="text" name="sku" class="form-control" required placeholder="e.g. ITM-0001">
      </div>
      {% endif %}
      <div class="{{ 'col-6' if not item else 'col-12' }}">
        <label class="form-label">Item Name</label>
        <input type="text" name="name" class="form-control" required value="{{ item.name if item else '' }}">
      </div>
      <div class="col-6">
        <label class="form-label">Category</label>
        <select name="category_id" class="form-select" required>
          {% for cat in categories %}
            <option value="{{ cat.id }}" {{ 'selected' if item and item.category_id == cat.id }}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          <option value="available" {{ 'selected' if item and item.status == 'available' }}>Available</option>
          <option value="unavailable" {{ 'selected' if item and item.status == 'unavailable' }}>Unavailable</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Price ({{ currency_symbol }})</label>
        <input type="number" step="0.01" name="price" class="form-control" required value="{{ item.price if item else '' }}">
      </div>
      <div class="col-6">
        <label class="form-label">Quantity Available</label>
        <input type="number" name="quantity_available" class="form-control" value="{{ item.quantity_available if item else 0 }}">
      </div>
      <div class="col-6">
        <label class="form-label">Discount %</label>
        <input type="number" step="0.01" name="discount_percent" class="form-control" value="{{ item.discount_percent if item else 0 }}">
      </div>
      <div class="col-6">
        <label class="form-label">Tax (GST) %</label>
        <input type="number" step="0.01" name="tax_percent" class="form-control" value="{{ item.tax_percent if item else 5.0 }}">
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-accent">Save Item</button>
      <a href="{{ url_for('items.list_items') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
